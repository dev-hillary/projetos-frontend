<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web | Hillary Alcântara</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="calculator-container">
        <!-- Tela de Exibição (Display) -->
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <!-- Teclado Numérico e Operações (Grid) -->
        <div class="buttons-grid">
            <!-- Linha 1 -->
            <button class="btn btn-action" data-action="clear" aria-label="Limpar tudo">C</button>
            <button class="btn btn-action" data-action="delete" aria-label="Apagar último caractere">⌫</button>
            <button class="btn btn-operator" data-operator="%" aria-label="Porcentagem">%</button>
            <button class="btn btn-operator" data-operator="÷" aria-label="Divisão">÷</button>

            <!-- Linha 2 -->
            <button class="btn btn-number" data-number="7">7</button>
            <button class="btn btn-number" data-number="8">8</button>
            <button class="btn btn-number" data-number="9">9</button>
            <button class="btn btn-operator" data-operator="×" aria-label="Multiplicação">×</button>

            <!-- Linha 3 -->
            <button class="btn btn-number" data-number="4">4</button>
            <button class="btn btn-number" data-number="5">5</button>
            <button class="btn btn-number" data-number="6">6</button>
            <button class="btn btn-operator" data-operator="-" aria-label="Subtração">-</button>

            <!-- Linha 4 -->
            <button class="btn btn-number" data-number="1">1</button>
            <button class="btn btn-number" data-number="2">2</button>
            <button class="btn btn-number" data-number="3">3</button>
            <button class="btn btn-operator" data-operator="+" aria-label="Adição">+</button>

            <!-- Linha 5 -->
            <button class="btn btn-number span-two" data-number="0">0</button>
            <button class="btn btn-number" data-number="." aria-label="Ponto decimal">,</button>
            <button class="btn btn-equals" data-action="calculate" aria-label="Calcular resultado">=</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
